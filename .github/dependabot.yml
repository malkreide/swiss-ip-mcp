version: 2
updates:
  # Python dependencies (mcp SDK, httpx, pydantic, …)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns:
          - "mcp"
          - "mcp-types"
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in CI / publish workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
