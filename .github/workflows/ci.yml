name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ruff kommt exakt gepinnt aus dem `dev`-Extra in pyproject.toml. Kein
      # zweiter Pin-Schritt hier: Zwei Stellen fuer dieselbe Version driften
      # auseinander, und die CI merkt es nicht, weil sie sich selbst
      # ueberschreibt — lokal laeuft dann ein anderes Gate als hier.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax check
        run: python -m py_compile src/swiss_ip_mcp/server.py

      # Ohne Bedingung. Hier stand `if [ -d "tests" ]; then … else echo "No
      # tests directory found, skipping."; fi` — ein Zweig, der bei
      # verschwundenem `tests/` eine Zeile ausgibt und mit 0 endet. Der Job
      # waere gruen geblieben, ohne einen einzigen Test gefahren zu haben, und
      # ein gruener Haken haette dann bedeutet: nichts geprueft.
      #
      # Uebersprungen ist nicht bestanden (OPS-005). Fehlt `tests/`, endet
      # pytest mit 4; sammelt es nach `-m "not live"` nichts ein, mit 5.
      # Beides ist rot, und beides ist die richtige Antwort: Ein Unit-Gate
      # ohne Unit-Tests hat nichts zugesichert.
      - name: Run unit tests (excluding live)
        run: pytest tests/ -m "not live" -v

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
