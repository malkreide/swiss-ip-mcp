name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ruff kommt exakt gepinnt aus dem `dev`-Extra in pyproject.toml. Kein
      # zweiter Pin-Schritt hier: Zwei Stellen fuer dieselbe Version driften
      # auseinander, und die CI merkt es nicht, weil sie sich selbst
      # ueberschreibt — lokal laeuft dann ein anderes Gate als hier.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax check
        run: python -m py_compile src/swiss_ip_mcp/server.py

      - name: Run unit tests (excluding live)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -m "not live" -v
          else
            echo "No tests directory found, skipping."
          fi

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
