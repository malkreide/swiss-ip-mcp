# Einmalige Messung der Antwortform von swissreg.ch (IGE/IPI).
#
# Kein `schedule`: Das hier ist kein Waechter, sondern ein Messgeraet. Es wird
# von Hand angeworfen, wenn eine Frage offen ist, die nur die Quelle selbst
# beantworten kann — etwa die vom 4.10.2026: Warum findet
# `_parse_result_page` null Items, obwohl die Abfrage eine Antwort bekommt?
#
# Die Sonde berichtet Struktur, nicht Inhalt: Pfade, Attributnamen,
# Textlaengen, und als einzigen Klartextwert `TotalCount`. Welche Marken im
# Register stehen, gehoert nicht in ein Workflow-Log; welche Felder die Antwort
# traegt, schon. Die Zusicherung dazu haengt an
# `tests/test_probe_response_shape.py` und nicht am Wohlverhalten des Aufrufers.

name: Antwortform messen

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "messen (Struktur ins Log) oder aufzeichnen (Fixtures als Artifact)"
        required: false
        default: messen
        type: choice
        options:
          - messen
          - aufzeichnen
      only:
        description: "Welche Abfrage messen (nur im Modus messen)"
        required: false
        default: alle
        type: choice
        options:
          - alle
          - trademark
          - patent
          - spc
          - quota

permissions:
  contents: read

concurrency:
  group: shape-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Antwortform von swissreg.ch (IGE/IPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Kein `continue-on-error`: Kam keine einzige Antwort, hat niemand etwas
      # gemessen, und ein gruener Haken darauf waere derselbe Fehler wie der
      # uebersprungene Testlauf, vor dem `classify_live_run.py` warnt. Die
      # Sonde endet dann selbst mit 1.
      - name: Sonde
        if: inputs.mode != 'aufzeichnen'
        env:
          IGE_USERNAME: ${{ secrets.IGE_USERNAME }}
          IGE_PASSWORD: ${{ secrets.IGE_PASSWORD }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ -n "$ONLY" ] && [ "$ONLY" != "alle" ]; then
            args+=(--only "$ONLY")
          fi
          # In die Zusammenfassung UND ins Log: Die Zusammenfassung liest sich
          # besser, das Log bleibt die Quelle, wenn sie abgeschnitten wird.
          {
            echo '## Antwortform von swissreg.ch'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/probe_response_shape.py "${args[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Der Rekorder schreibt nur, was durch seine eigene Anonymisierungs-
      # kontrolle kommt; ueberlebt ein Originaltext, laesst er die Datei weg
      # und sagt das. Kein `continue-on-error`: Nichts aufgezeichnet ist nicht
      # gruen, und er endet dann selbst mit 1.
      - name: Aufzeichnen
        if: inputs.mode == 'aufzeichnen'
        env:
          IGE_USERNAME: ${{ secrets.IGE_USERNAME }}
          IGE_PASSWORD: ${{ secrets.IGE_PASSWORD }}
        run: |
          python scripts/record_live_fixtures.py --out fixtures-neu
          {
            echo '## Aufgezeichnete Antworten'
            echo
            echo '```'
            ls -l fixtures-neu
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ueber ein Artifact, nicht per Commit aus dem Workflow: Dieser Job hat
      # `contents: read` und soll es behalten. Die Dateien kommen von Hand ins
      # Repo, nachdem jemand hineingesehen hat.
      - name: Aufzeichnung hochladen
        if: inputs.mode == 'aufzeichnen'
        uses: actions/upload-artifact@v4
        with:
          name: live-fixtures
          path: fixtures-neu/
          if-no-files-found: error
          retention-days: 7
