# Hardened Kubernetes deployment for swiss-ip-mcp (SEC-007 / SCALE-006).
# Create the IGE credentials secret first:
#   kubectl create secret generic swiss-ip-mcp-creds \
#     --from-literal=IGE_USERNAME=... --from-literal=IGE_PASSWORD=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiss-ip-mcp
  labels:
    app: swiss-ip-mcp
spec:
  # Stateless HTTP (MCP_STATELESS_HTTP=1) → replicas need no session affinity.
  replicas: 2
  selector:
    matchLabels:
      app: swiss-ip-mcp
  template:
    metadata:
      labels:
        app: swiss-ip-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: swiss-ip-mcp
          image: ghcr.io/malkreide/swiss-ip-mcp:latest
          ports:
            - containerPort: 8000
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: MCP_STATELESS_HTTP
              value: "1"
            - name: IGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiss-ip-mcp-creds
                  key: IGE_USERNAME
            - name: IGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiss-ip-mcp-creds
                  key: IGE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: swiss-ip-mcp
  labels:
    app: swiss-ip-mcp
spec:
  type: ClusterIP
  selector:
    app: swiss-ip-mcp
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
