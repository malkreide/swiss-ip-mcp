# HAProxy edge config for STATEFUL Streamable HTTP (SCALE-002 / SCALE-003).
#
# Only needed when running WITHOUT MCP_STATELESS_HTTP (i.e. the server keeps
# per-session state). It pins each Mcp-Session-Id to one backend via a
# stick-table, so follow-up requests for a session reach the same replica.
# In stateless mode (MCP_STATELESS_HTTP=1, the default in our images) plain
# round-robin is sufficient and this file is unnecessary.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  120s
    timeout server  120s

frontend mcp_front
    bind *:8000
    default_backend mcp_back

backend mcp_back
    balance roundrobin

    # Backend health via the app's /health endpoint.
    option httpchk GET /health

    # Session affinity keyed on the Mcp-Session-Id header.
    # Capacity 100k sessions, TTL 24h (correlate with the session lifetime).
    stick-table type string len 64 size 100k expire 24h
    stick on req.hdr(Mcp-Session-Id)
    stick store-response res.hdr(Mcp-Session-Id)

    server mcp1 swiss-ip-mcp-1:8000 check
    server mcp2 swiss-ip-mcp-2:8000 check
